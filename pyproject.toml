[project]
name = "sound_source_localization"
version = "0.1.0"
description = "Sound Source Localization for 3D Spatial Mapping of Surgical Actions in Dynamic Scenes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "audiomentations>=0.43.1",
    "datasets>=4.4.1",
    "evaluate>=0.4.6",
    "ipywidgets>=8.1.8",
    "manifold3d>=3.3.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "open3d>=0.19.0",
    "opencv-python>=4.11.0.86",
    "pathlib>=1.0.1",
    "pip>=25.3",
    "pyzed>=1.3.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "trimesh>=4.10.1",
]

[project.optional-dependencies]
se-resnet = [
    "tensorflow>=2.20.0",
]

[tool.uv.sources]
pyzed = { path = "pyzed-5.0-cp312-cp312-linux_x86_64.whl" }
